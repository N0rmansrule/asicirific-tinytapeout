# Tiny Tapeout project information
project:
  title:        "ASICirific serial RV32E MCU"
  author:       "Aleksander J. Norman"
  discord:      ""
  description:  "Bit-serial RV32E microcontroller: CPU + QSPI controller for external flash/PSRAM + GPIO"
  language:     "Verilog"
  clock_hz:     25000000

  tiles: "3x2"

  top_module:  "tt_um_asicirific"

  source_files:
    - "project.v"

pinout:
  ui[0]: "gpio_in[0] (button)"
  ui[1]: "gpio_in[1] (button)"
  ui[2]: "gpio_in[2] (button)"
  ui[3]: "gpio_in[3] (button)"
  ui[4]: "gpio_in[4]"
  ui[5]: "gpio_in[5]"
  ui[6]: "gpio_in[6]"
  ui[7]: "gpio_in[7]"

  uo[0]: "gpio_out[0] (LED)"
  uo[1]: "gpio_out[1] (LED)"
  uo[2]: "gpio_out[2]"
  uo[3]: "gpio_out[3]"
  uo[4]: "gpio_out[4]"
  uo[5]: "gpio_out[5]"
  uo[6]: "gpio_out[6]"
  uo[7]: "gpio_out[7]"

  uio[0]: "QSPI SD0 (flash/PSRAM data)"
  uio[1]: "QSPI SD1 (flash/PSRAM data, input)"
  uio[2]: "QSPI SD2"
  uio[3]: "QSPI SD3"
  uio[4]: "QSPI SCK"
  uio[5]: "QSPI CS_flash"
  uio[6]: "QSPI CS_ram"
  uio[7]: "gpio_out[8]"

yaml_version: 6
