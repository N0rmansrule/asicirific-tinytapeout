# info.yaml — TinyTapeout project metadata for the ASICirific subset (Tile A).
# See https://tinytapeout.com for the current schema. Adjust `tiles` after the
# first synthesis/harden run tells you the real area.

project:
  title:        "ASICirific RV32I MCU"
  author:       "Thomas J. Norman"
  discord:      ""
  description:  "RV32I microcontroller with a serial (USB-C) bootloader, UART, GPIO, and JTAG debug"
  language:     "SystemVerilog"
  clock_hz:     25000000            # target 25 MHz; sweep in synthesis

  # Bump to "2x2" etc. if synthesis reports the design does not fit one tile.
  tiles:        "1x1"

  top_module:   "tt_um_asicirific"

  # Every RTL file that the design needs, relative to src/.
  # uart_boot.sv is listed FIRST as a defensive ordering choice.
  source_files:
    - "project.v"

# Pin assignments. Text shows up on the datasheet page.
pinout:
  ui[0]:  "uart_rx (host -> chip)"
  ui[1]:  "BOOT (high at reset = USB download mode)"
  ui[2]:  "gpio_in[0]"
  ui[3]:  "gpio_in[1]"
  ui[4]:  "gpio_in[2]"
  ui[5]:  ""
  ui[6]:  ""
  ui[7]:  ""

  uo[0]:  "uart_tx (chip -> host)"
  uo[1]:  "boot_active"
  uo[2]:  "tdo (JTAG)"
  uo[3]:  "gpio_out[0]"
  uo[4]:  "gpio_out[1]"
  uo[5]:  "gpio_out[2]"
  uo[6]:  "gpio_out[3]"
  uo[7]:  "gpio_out[4]"

  uio[0]: "tck (JTAG in)"
  uio[1]: "tms (JTAG in)"
  uio[2]: "tdi (JTAG in)"
  uio[3]: "trst_n (JTAG in)"
  uio[4]: "gpio_out[5]"
  uio[5]: "gpio_out[6]"
  uio[6]: "gpio_out[7]"
  uio[7]: "boot_done"

# Do not change unless you know what you are doing.
yaml_version: 6
